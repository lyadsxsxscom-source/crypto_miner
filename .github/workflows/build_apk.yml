name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Generate Fixed Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "=========================================="
          echo "YOUR SHA1 FINGERPRINT IS BELOW:"
          keytool -list -v -alias androiddebugkey -keystore ~/.android/debug.keystore -storepass android | grep "SHA1:"
          echo "=========================================="

      - run: flutter pub get

      - name: Build Signed Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
